name: Publicar sitio

# Genera sitio/usuarios.json a partir del secret PANEL_USERS (ver
# scripts/build_usuarios.py) y publica sitio/ en Azure Static Web Apps.
# Requiere dos secrets en Settings → Secrets and variables → Actions:
#   - PANEL_USERS: JSON con las credenciales de login (ver
#     docs/decisiones/002-login-y-control-de-acceso.md)
#   - AZURE_STATIC_WEB_APPS_API_TOKEN: token de deploy de la Static Web App
#     (Azure Portal → el recurso → Overview → "Manage deployment token")
# Ver docs/publicar-sitio.md para el instructivo completo.

on:
  push:
    branches: [main]
    paths:
      - 'sitio/**'
      - 'scripts/build_usuarios.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar usuarios.json con contraseñas hasheadas
        env:
          PANEL_USERS: ${{ secrets.PANEL_USERS }}
        run: python scripts/build_usuarios.py
      - name: Publicar en Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: sitio
          output_location: ""
          skip_app_build: true
